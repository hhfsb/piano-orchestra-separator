<!doctype html><meta charset=utf-8>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1116"><title>Comparison player</title>
<style>
:root{--bg:#0f1116;--card:#171a21;--line:#272c36;--fg:#e8eaed;--dim:#98a1ab;--acc:#4f7cff;--good:#3aa76d}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f8;--card:#fff;--line:#e2e6ec;--fg:#14171c;--dim:#5a636d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:17px;margin:0 0 2px}.sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
select{font:inherit;font-size:14.5px;padding:11px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);width:100%}
.lbl{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 5px}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--fg);
  border-radius:10px;cursor:pointer;padding:10px 12px;min-height:44px}
button:active{opacity:.7}
button.pill{font-size:13px;padding:9px 12px;min-height:40px}
button.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
#play{width:52px;height:52px;min-height:52px;border-radius:50%;background:var(--acc);border-color:var(--acc);
  color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;min-width:88px;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc);height:26px}
.blend{display:flex;align-items:center;gap:10px;margin-top:4px}
.blend span{font-size:12px;color:var(--dim);white-space:nowrap}
.blend b{color:var(--fg);font-weight:600}
.meta{color:var(--dim);font-size:12.5px;margin-top:10px;min-height:34px}
.ok{color:var(--good);font-weight:600}
.warn{color:#c0752b}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.sticky .inner{max-width:760px;margin:0 auto}
@media (min-width:700px){.sticky .inner{display:flex;gap:12px;align-items:center}
 .sticky .seekwrap{flex:1}.sticky .blend{width:260px;margin:0}}
.seekwrap{display:flex;align-items:center;gap:10px;margin-top:8px}
button.info{width:22px;height:22px;min-height:0;padding:0;border-radius:50%;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  margin-left:6px;color:var(--dim);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:30}
.modal[hidden]{display:none}
.modalbox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:620px;
  width:100%;max-height:82vh;overflow:auto;padding:16px 16px 20px;position:relative}
.modalbox h2{font-size:15px;margin:0 0 4px}
.modalbox .hint{color:var(--dim);font-size:12.5px;margin-bottom:8px}
.modalbox dt{font-weight:600;margin-top:14px;font-size:14px}
.modalbox dd{margin:4px 0 0;color:var(--dim);font-size:13px;line-height:1.5}
#close{position:absolute;top:10px;right:10px;width:32px;height:32px;min-height:32px;border-radius:50%;
  padding:0;font-size:17px;line-height:1}
</style>
<div class=wrap>
 <h1>Piano / orchestra separation — comparison player</h1>
 <div class=sub>Pick a track, pick a model, drag the slider between the piano stem and the
 orchestra stem. <a href="results.html">measured results</a> &middot; <a href="../index.html">separator demo</a></div>
 <div class=panel>
  <div class=lbl>Track</div>
  <select id=track></select>
  <div class=meta id=meta></div>
  <div class=lbl>Model <button id=info class=info aria-label="what do these names mean">i</button></div>
  <div class=row id=models></div>
 </div>
</div>
<div id=modal class=modal hidden><div class=modalbox>
 <button id=close aria-label=close>&times;</button><div id=modalbody></div>
</div></div>
<div class=sticky><div class=inner>
 <div class=row>
  <button id=play aria-label=play>&#9654;</button>
  <div class=seekwrap><input id=seek type=range min=0 max=1000 value=0>
   <span class=time id=time>0:00 / 0:00</span></div>
 </div>
 <div class=blend>
  <span>piano</span><input id=blend type=range min=0 max=100 value=50><span>orchestra</span>
 </div>
</div></div>

  if(c2.readyState>=1) go();
  updTime();
}
function startPlay(){
  initAudio(); if(ctx.state==='suspended') ctx.resume();
  const hasStems=A.piano.src && A.orch.src;
  if(hasStems){ A.piano.currentTime=A.orch.currentTime; A.piano.play().catch(()=>{}); A.orch.play().catch(()=>{}); }
  else A.mix.play().catch(()=>{});
  playing=true; el('play').innerHTML='&#10074;&#10074;';
}
function stopPlay(){
  A.piano.pause(); A.orch.pause(); A.mix.pause(); playing=false; el('play').innerHTML='&#9654;';
}
function clock(){ return (A.piano.src&&!A.mix.src)?A.piano:A.mix; }
function updTime(){
  const c=clock(); const d=c.duration||0;
  el('time').textContent=fmt(c.currentTime)+' / '+fmt(d);
  if(d) el('seek').value=1000*c.currentTime/d;
}
setInterval(()=>{ if(playing) updTime(); },200);
el('play').onclick=()=> playing?stopPlay():startPlay();
el('seek').oninput=()=>{
  const c=clock(); if(!c.duration) return;
  const t=c.duration*el('seek').value/1000;
  c.currentTime=t; if(A.piano.src&&A.orch.src) A.orch.currentTime=t;
};
el('blend').oninput=()=>setBlend(+el('blend').value/100);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.key===' '){e.preventDefault(); playing?stopPlay():startPlay();}
  if(e.key==='ArrowRight'){const c=clock(); c.currentTime=(c.currentTime||0)+2;}
  if(e.key==='ArrowLeft'){const c=clock(); c.currentTime=Math.max(0,(c.currentTime||0)-2);}
});
const INFO=[{"name":"mixture (input)","text":"The two stems summed - what the separator is given. Reference for how much of the orchestra you can still hear in the piano-only version."},{"name":"ground truth","text":"The true piano and orchestra stems from the dataset. Compare against these to hear what the model got wrong, not just what it changed."},{"name":"PCD base","text":"The shipped UMX20_R_H_HU_HUS two-head Open-Unmix, trained by the original authors on the Piano Concerto Dataset - real concert recordings, 20 s segments. It never saw two sources on the same pitch. Held-out PCD: 3.80 dB SI-SDR."},{"name":"+ unison","text":"Fine-tuned on the first synthetic set: 1 000 items of piano and orchestra on identical pitches and onsets, 30 % real PCD rehearsal per batch, lr 1e-4, 16 epochs. Held-out PCD: 3.93 dB. The first time the model could separate a doubled line at all."},{"name":"+ timbre","text":"Same recipe, richer data: string articulations (pizzicato, tremolo, harmonics, marcato, staccato, spiccato), five solo string instruments, and 8 piano ADSR characters with per-note attack and damper. Held-out PCD: 3.95 dB. Also less over-separation on the Mozart clip."},{"name":"+ octave","text":"Adds octave-displaced doublings: strings an octave below or above the piano, a split tutti, and unison-plus-octave together. Octave items 4.08 -> 4.30 dB, unison items unchanged, held-out PCD 3.97 dB."},{"name":"+ asym loss","text":"Same data as + octave, different objective: each source's error is split into missing and stray energy, with stray (invented) energy from the piano penalised 3x and missing energy for the orchestra 2x. Piano stray energy drops from 46 % to 24 % of its error; SI-SDR is unchanged (-0.04 dB). Listen for a cleaner, slightly thinner piano."},{"name":"distilled 5 MB","text":"A 256-wide, 2-layer student distilled from the + timbre teacher (70 % imitation of the teacher's magnitude, 30 % ground truth), 5.1 MB as int8. Keeps most of the unison gain but loses real recordings: held-out PCD 2.06 dB."},{"name":"symmetric","text":"Plain MSE on both sources - the original recipe, on the octave dataset."},{"name":"asymmetric","text":"Per-source loss on the octave dataset: piano stray x3, orchestra missing x2."}];
function openInfo(){
  const box=el('modalbody');
  box.innerHTML='<h2>What the models are</h2><div class=hint>Each name is the modification made '+
                'to the PCD base model, cumulatively.</div>';
  INFO.forEach(x=>{

    const dd=document.createElement('dd'); dd.textContent=x.text;
    box.append(dt,dd);

document.addEventListener('keydown',e=>{ if(e.key==='Escape') el('modal').hidden=true; });
